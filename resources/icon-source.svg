<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05060c"/>
      <stop offset="100%" stop-color="#0d1120"/>
    </linearGradient>
    <linearGradient id="nw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3ee6ff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <!-- 六边形科技框 -->
  <polygon points="256,52 428,154 428,358 256,460 84,358 84,154"
    fill="none" stroke="url(#nw)" stroke-width="7" opacity="0.55"/>
  <polygon points="256,86 398,172 398,340 256,426 114,340 114,172"
    fill="url(#nw)" opacity="0.06"/>
  <!-- NW 字母 (几何化) -->
  <g fill="none" stroke="url(#nw)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M 158 322 L 158 190 L 224 268 L 224 190"/>
    <path d="M 354 190 L 300 322 L 246 190"/>
  </g>
  <!-- 核心节点 -->
  <circle cx="256" cy="256" r="12" fill="#3ee6ff" filter="url(#glow)"/>
</svg>
