<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="color-scheme" content="dark" />
  <title>New World · 启动日志</title>
  <style>
    /* 极简中性风: 无霓虹、无渐变发光、无装饰动画。只保留 logo + 真实日志窗口。
       Splash 不走 Vite 管线, 颜色在此字面量锁定, 不 import tokens.css。 */
    :root {
      --bg: #101014;
      --panel: #17171c;
      --border: #2b2b33;
      --fg: #d6d6dc;
      --muted: #8d8d98;
      --ok: #83c9a6;
      --warn: #d9b169;
      --error: #e08585;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, "Courier New", monospace;
    }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--fg);
      overflow: hidden;
      font-family: var(--mono);
      -webkit-user-select: none; user-select: none;
    }
    #app {
      display: flex; flex-direction: column;
      height: 100%; box-sizing: border-box;
      padding: 22px; gap: 14px;
    }
    header { display: flex; align-items: baseline; gap: 12px; flex: 0 0 auto; }
    #logo {
      font-size: 15px; font-weight: 600; letter-spacing: .16em;
      color: var(--fg);
    }
    #subtitle { font-size: 11px; color: var(--muted); letter-spacing: .03em; }

    #terminal {
      flex: 1 1 auto; min-height: 0;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 12px 13px;
      box-sizing: border-box;
      overflow-y: auto;
      font-size: 11.5px;
      line-height: 1.7;
      font-variant-ligatures: none;
    }
    #terminal::-webkit-scrollbar { width: 7px; }
    #terminal::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    #terminal .line { white-space: pre-wrap; word-break: break-word; }
    #terminal .ts { color: var(--muted); }
    #terminal .lvl-info { color: var(--fg); }
    #terminal .lvl-warn { color: var(--warn); }
    #terminal .lvl-error { color: var(--error); }
    #terminal .stage { color: var(--ok); }
    #terminal .msg { color: var(--fg); }
    #terminal .placeholder { color: var(--muted); }

    @media (prefers-reduced-motion: reduce) {
      #terminal { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div id="logo" data-i18n="logo">NEW WORLD</div>
      <div id="subtitle" data-i18n="subtitle">正在启动…</div>
    </header>
    <div id="terminal" aria-label="boot-log">
      <div class="placeholder" id="placeholder">等待主进程启动日志…</div>
    </div>
  </div>

  <script>
    // ============ Splash 渲染层: 真实启动日志流 ============
    // 数据源: window.electronAPI.nova.onBootEvent(handler) —— 主进程 BootOrchestrator.pushBootLog()
    //   经 SplashWindow.pushBootLog() → webContents.send('nova:boot-event', { log })
    // 每条载荷: { log: { level: 'INFO'|'WARN'|'ERROR', message, timestamp, stage? } }
    // 非 Electron 环境(浏览器直开/单测): electronAPI 不存在 → 仅显示占位, 不阻塞、不造假。
    (function () {
      'use strict';

      // 双语硬编码(splash 不走 Vite 管线, 不能 import vue-i18n)
      var I18N = {
        'zh': { 'logo': 'NEW WORLD', 'subtitle': '正在启动…', 'placeholder': '等待主进程启动日志…' },
        'en': { 'logo': 'NEW WORLD', 'subtitle': 'Starting…', 'placeholder': 'Waiting for boot log…' }
      };
      var LANG = (navigator.language || 'en').toLowerCase();
      var L = LANG.indexOf('zh') === 0 ? I18N['zh'] : I18N['en'];
      document.querySelectorAll('[data-i18n]').forEach(function (el) {
        var key = el.getAttribute('data-i18n');
        if (L[key]) el.textContent = L[key];
      });

      var term = document.getElementById('terminal');
      var placeholder = document.getElementById('placeholder');

      function pad(n, len) {
        var s = String(n);
        while (s.length < len) s = '0' + s;
        return s;
      }
      function fmtTime(ts) {
        var d = new Date(typeof ts === 'number' ? ts : Date.now());
        return pad(d.getHours(), 2) + ':' + pad(d.getMinutes(), 2) + ':' +
          pad(d.getSeconds(), 2) + '.' + pad(d.getMilliseconds(), 3);
      }
      function esc(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
          .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      function appendLog(log) {
        if (!log || typeof log !== 'object') return;
        if (placeholder && placeholder.parentNode) {
          placeholder.parentNode.removeChild(placeholder);
          placeholder = null;
        }
        var level = String(log.level || 'INFO').toUpperCase();
        var cls = level === 'WARN' ? 'lvl-warn' : level === 'ERROR' ? 'lvl-error' : 'lvl-info';
        var html = '<span class="ts">[' + fmtTime(log.timestamp) + ']</span> ' +
          '<span class="' + cls + '">[' + esc(level) + ']</span> ';
        if (log.stage) html += '<span class="stage">[' + esc(log.stage) + ']</span> ';
        html += '<span class="msg">' + esc(log.message == null ? '' : log.message) + '</span>';

        var line = document.createElement('div');
        line.className = 'line';
        line.innerHTML = html;
        term.appendChild(line);
        // 逐行追加, 自动滚到底部
        term.scrollTop = term.scrollHeight;
      }

      var api = (typeof window !== 'undefined' && window.electronAPI && window.electronAPI.nova)
        ? window.electronAPI.nova : null;
      if (api && typeof api.onBootEvent === 'function') {
        api.onBootEvent(function (ev) {
          // 只消费真实日志行; 兼容旧 stage 事件(忽略, 不再展示假阶段文字)
          if (ev && ev.log) appendLog(ev.log);
        });
      }
    })();
  </script>
</body>
</html>
