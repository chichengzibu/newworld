name: New World Release

# 触发: 推送 v* 格式 tag (如 v4.3.1)
# 行为: 3 平台 build installer → 上传 artifact → 生成 latest.yml → 创建 GitHub Release
# 依赖: GH_TOKEN (自动提供), 需在 repo settings 配置 ELECTRON_BUILDER_CACHE 等可选变量

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v4.3.1)'
        required: true

jobs:
  release:
    name: Build & Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-13, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要 git tag history 给 electron-builder

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Linux rpm target 需要 rpmbuild(默认 ubuntu runner 不带)
      - name: Install rpm tooling (linux only)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build renderer + electron
        # 注意: 不要加 --publish,自己用 gh release upload 上传(避免 electron-builder 自动创建 draft release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Windows 用 ; 分隔,Unix 用 :
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'  # 暂未签证书,跳过
        run: npm run build

      - name: Upload artifacts (windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: newworld-windows-x64
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml

      - name: Upload artifacts (macos)
        if: matrix.os == 'macos-13'
        uses: actions/upload-artifact@v7
        with:
          name: newworld-macos
          path: |
            release/*.dmg
            release/*.blockmap
            release/latest-mac.yml

      - name: Upload artifacts (linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: newworld-linux-x64
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.blockmap
            release/latest-linux.yml

  publish:
    name: Publish GitHub Release
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release

      - name: List downloaded files
        run: |
          echo "=== Release artifacts ==="
          ls -laR dist-release/
          find dist-release -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.yml" -o -name "*.blockmap" \) | sort

      # ── SHA256 校验值 ──
      # 本版本未做代码签名（Windows 会显示"未知发布者"）。
      # 提供 SHA256 让用户能自行核对下载的文件是否被篡改 —— 这是无签名
      # 分发的最低诚信要求，也是用户判断"这个 exe 是不是官方构建"的唯一手段。
      - name: Generate SHA256 checksums
        run: |
          cd dist-release
          {
            echo "# SHA256 校验值"
            echo ""
            echo "本版本未进行代码签名。Windows 首次运行可能提示「未知发布者」，"
            echo "这是未签名软件的预期行为，不表示文件有问题。"
            echo ""
            echo "校验方式："
            echo "  Windows  PowerShell: Get-FileHash <文件名> -Algorithm SHA256"
            echo "  macOS/Linux           shasum -a 256 <文件名>"
            echo ""
            echo "如果校验值与本文件一致，说明下载完整且未被篡改。"
            echo ""
            find . -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \) -print0 \
              | sort -z \
              | xargs -0 -I{} sh -c 'printf "%s  %s\n" "$(sha256sum "{}" | cut -d" " -f1)" "$(basename "{}")"'
          } > SHA256SUMS.txt
          echo "=== 生成的校验文件 ==="
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # push tag 时 github.ref_name 即 tag;workflow_dispatch 时 ref_name 是分支名,
          # 必须回落到 inputs.tag,否则会创建名为 "master" 的 Release。
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          draft: false
          # 含 -alpha/-beta/-rc 的版本号按 prerelease 处理,避免 auto-updater 把
          # 预发布版推给正式版用户。
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-alpha') || contains(inputs.tag || github.ref_name, '-beta') || contains(inputs.tag || github.ref_name, '-rc') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## 关于代码签名

            本版本**未进行代码签名**。Windows 首次运行安装包时可能弹出「未知发布者」
            的 SmartScreen 提示 —— 这是未签名软件的预期行为，不表示文件有问题。

            请下载后核对 `SHA256SUMS.txt` 中的校验值，确认文件完整且未被篡改：

            ```powershell
            # Windows
            Get-FileHash "New World-x.x.x-Setup.exe" -Algorithm SHA256
            ```

            ```bash
            # macOS / Linux
            shasum -a 256 "New World-x.x.x.dmg"
            ```

            所有构建产物均由本仓库的 GitHub Actions 从源码构建，
            可在 Actions 页面查看对应 tag 的构建记录。
          files: |
            dist-release/**/*.exe
            dist-release/**/*.dmg
            dist-release/**/*.AppImage
            dist-release/**/*.deb
            dist-release/**/*.rpm
            dist-release/**/*.yml
            dist-release/**/*.blockmap
            dist-release/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}