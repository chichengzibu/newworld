name: PiPiClaw CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        node-version: [20]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Linux rpm target 需要 rpmbuild(默认 ubuntu runner 不带)
      - name: Install rpm tooling (linux only)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: TypeScript typecheck (node)
        run: npx tsc --noEmit -p tsconfig.node.json

      - name: Vue typecheck
        run: npx vue-tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Vitest unit
        run: npx vitest run --reporter=verbose

      - name: Build renderer (vite)
        run: npm run build

      - name: Smoke test (build artifacts + IPC surface)
        run: npm run smoke

      # Phase 0 P0-T0.3: 防止 v3.0.0 SideNav broken 重演
      # build 本身不会 catch 图标没注册 / CSP 缺 unsafe-eval
      # 所以加这两道防线:
      - name: Verify element-plus icons registered in bundle
        # P0-T0.3: 防止 v3.0.0 SideNav broken 重演
        # bundle 本身不能 catch 缺图标注册 / 缺 unsafe-eval CSP,
        # 所以加两道防线:
        #   1) dist/index.html 包含 'unsafe-eval' (Vue runtime 必需)
        #   2) main bundle 包含 element-plus 图标的实际组件名
        #      (vite 会重命名 import,但组件的 name 属性保留原始字符串,
        #       可作为 'icons registered' 的可靠信号)
        run: |
          if ! grep -q "unsafe-eval" dist/index.html; then
            echo "❌ dist/index.html missing 'unsafe-eval' in CSP (Vue runtime will fail)"
            exit 1
          fi
          missing=0
          for icon in ChatDotRound HomeFilled Setting Box Cpu; do
            if ! grep -q "$icon" dist/assets/index-*.js; then
              echo "❌ main bundle missing icon component: $icon"
              missing=$((missing+1))
            fi
          done
          if [ $missing -gt 0 ]; then
            echo "❌ $missing icons missing - element-plus icons not bundled"
            exit 1
          fi
          echo "✅ Build artifacts: CSP safe + 5 critical icons bundled"

      - name: Sandbox selfcheck
        run: node scripts/sandbox-selfcheck.mjs || echo "sandbox soft-fail no docker in CI"

      # 【M4-Q】e2e 全量进门禁
      # 此前这一步只跑 **4 个 spec**(chat-agent / settings-p7 / a5-computer-use /
      # ui-smoke)—— 而近几批挖到的 P0 全都**不在那 4 个里**:
      #   · Chat 虚拟列表红屏(打开有消息的会话就整屏报错)
      #   · 悬浮命令按钮压住「发送」按钮
      #   · MCP 沙箱拒绝被报告成「调用成功」
      # 「跑」没有变成「门禁」,bug 就会再来一遍。现:跑**全量**。
      #
      # 两个前置:
      #   ① xvfb —— Linux runner 没有 X server,Electron 起不来
      #   ② mock LLM 顶在 11434 —— 依赖 LLM 端点的 spec(error-recovery /
      #      network-failure / …)用仓库自带的 mock,**不装 6GB 真模型**(也不下载)，
      #      断言保持确定性
      - name: Playwright e2e - FULL suite (ubuntu only, hard-fail)
        if: matrix.os == 'ubuntu-latest'
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y xvfb
          # mock LLM:让依赖 LLM 端点的 spec 有确定性响应
          node scripts/mock-llm-server.mjs 11434 &
          sleep 3
          xvfb-run -a env E2E_ELECTRON=1 npx playwright test --reporter=line
          # mock LLM 不用主动杀 —— job 结束即回收

